[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "intervalinf"
version = "0.1.0"
description = "Function spaces and operators on 1D intervals - built on pygeoinf"
readme = "README.md"
license = "BSD-3-Clause"
requires-python = ">=3.11"
authors = [
    { name = "Your Name", email = "your.email@example.com" },
]
keywords = [
    "function spaces",
    "hilbert spaces",
    "spectral methods",
    "interval",
    "Laplacian",
    "Sobolev",
    "Lebesgue",
    "inverse problems",
    "geophysics",
]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Science/Research",
    "License :: OSI Approved :: BSD License",
    "Operating System :: OS Independent",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Topic :: Scientific/Engineering :: Mathematics",
    "Topic :: Scientific/Engineering :: Physics",
]
dependencies = [
    "numpy>=1.26.0",
    "scipy>=1.11.0",
    "pygeoinf>=1.4.2",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0.0",
    "pytest-cov>=4.0.0",
    "mypy>=1.0.0",
    "ruff>=0.1.0",
]
docs = [
    "sphinx>=7.0.0",
    "sphinx-rtd-theme>=2.0.0",
    "myst-parser>=2.0.0",
]
plotting = [
    "matplotlib>=3.8.0",
    "seaborn>=0.13.0",
]
all = [
    "intervalinf[dev,docs,plotting]",
]

[project.urls]
Homepage = "https://github.com/yourusername/intervalinf"
Documentation = "https://intervalinf.readthedocs.io"
Repository = "https://github.com/yourusername/intervalinf"
Issues = "https://github.com/yourusername/intervalinf/issues"

[tool.hatch.build.targets.wheel]
packages = ["intervalinf"]

[tool.pytest.ini_options]
testpaths = ["tests"]
python_files = ["test_*.py"]
python_functions = ["test_*"]
addopts = "-v --tb=short"
markers = [
    "unit: Fast unit tests",
    "integration: Integration tests with pygeoinf",
    "slow: Slow tests (skip with -m 'not slow')",
]

[tool.mypy]
python_version = "3.11"
warn_return_any = true
warn_unused_configs = true
ignore_missing_imports = true

[tool.ruff]
target-version = "py311"
line-length = 100
select = [
    "E",   # pycodestyle errors
    "W",   # pycodestyle warnings
    "F",   # Pyflakes
    "I",   # isort
    "B",   # flake8-bugbear
    "C4",  # flake8-comprehensions
    "UP",  # pyupgrade
]
ignore = [
    "E501",  # line too long (handled by formatter)
    "B008",  # do not perform function calls in argument defaults
]

[tool.ruff.isort]
known-first-party = ["intervalinf"]

[tool.coverage.run]
source = ["intervalinf"]
branch = true

[tool.coverage.report]
exclude_lines = [
    "pragma: no cover",
    "if TYPE_CHECKING:",
    "raise NotImplementedError",
]
